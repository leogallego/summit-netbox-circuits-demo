---
# pb_setup_mcp.yml
#
# Sets up AI MCP integration with AAP and NetBox on the local workstation.
# Deploys the NetBox MCP server as a container (HTTP transport) and generates
# .mcp.json pointing to both AAP and NetBox MCP endpoints.
#
# Usage:
#   source .env
#   ./run-playbook.sh ansible/pb_setup_mcp.yml
#
# Tags:
#   netbox  — deploy NetBox MCP server container
#   config  — generate .mcp.json only
#
# Examples:
#   ./run-playbook.sh ansible/pb_setup_mcp.yml                  # full setup
#   ./run-playbook.sh ansible/pb_setup_mcp.yml --tags config    # regenerate config only
#   ./run-playbook.sh ansible/pb_setup_mcp.yml --tags netbox    # deploy container only

- name: Set up MCP integration
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    mcp_aap_host: >-
      {{ lookup('env', 'MCP_AAP_SERVER') |
         default(lookup('env', 'AAP_URL') | urlsplit('hostname'), true) }}
    mcp_aap_port: "{{ lookup('env', 'MCP_AAP_PORT') | default('8448', true) }}"
    mcp_aap_base_url: "https://{{ mcp_aap_host }}:{{ mcp_aap_port }}"
    mcp_netbox_token: "{{ lookup('env', 'MCP_NETBOX_TOKEN') }}"
    mcp_netbox_enabled: "{{ mcp_netbox_token | length > 0 }}"
    netbox_url: "{{ lookup('env', 'NETBOX_URL') }}"
    netbox_verify_ssl: "{{ lookup('env', 'NETBOX_VERIFY_SSL') | default('true', true) | bool }}"
    netbox_mcp_image: "docker.io/netboxlabs/netbox-mcp-server:1.2.0"
    netbox_mcp_port: "{{ lookup('env', 'MCP_NETBOX_PORT') | default('8000', true) }}"
    mcp_services:
      - name: aap-mcp-job-management
        path: job_management
      - name: aap-mcp-inventory-management
        path: inventory_management
      - name: aap-mcp-system-monitoring
        path: system_monitoring
      - name: aap-mcp-user-management
        path: user_management
      - name: aap-mcp-security-compliance
        path: security_compliance
      - name: aap-mcp-platform-configuration
        path: platform_configuration

  tasks:

    - name: Validate AAP host is set
      ansible.builtin.assert:
        that:
          - mcp_aap_host | length > 0
        fail_msg: >-
          Cannot determine AAP gateway host. Set AAP_URL or MCP_AAP_SERVER
          in your .env file.
      tags:
        - always

    - name: Deploy NetBox MCP server container
      containers.podman.podman_container:
        name: netbox-mcp
        image: "{{ netbox_mcp_image }}"
        state: started
        env:
          NETBOX_URL: "{{ netbox_url }}"
          NETBOX_TOKEN: "{{ mcp_netbox_token }}"
          TRANSPORT: http
          HOST: "0.0.0.0"
          PORT: "8000"
          VERIFY_SSL: "{{ netbox_verify_ssl | string | lower }}"
        publish:
          - "{{ netbox_mcp_port }}:8000"
        restart_policy: unless-stopped
      when: mcp_netbox_enabled
      tags:
        - netbox

    - name: Generate .mcp.json
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/mcp.json.j2"
        dest: "{{ playbook_dir }}/../.mcp.json"
        mode: "0600"
      tags:
        - config

    - name: MCP setup complete
      ansible.builtin.debug:
        msg: >-
          .mcp.json written — {{ mcp_services | length }} AAP MCP services
          pointing at {{ mcp_aap_base_url }}{{ ', plus NetBox at http://127.0.0.1:' ~ netbox_mcp_port ~ '/mcp (container: netbox-mcp)' if mcp_netbox_enabled else ' (NetBox MCP skipped — MCP_NETBOX_TOKEN not set)' }}.
          Set MCP_AAP_TOKEN in your .env to authenticate.
        verbosity: 0
      tags:
        - config
