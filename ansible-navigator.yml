---
ansible-navigator:
  execution-environment:
    container-engine: podman
    enabled: true
    image: quay.io/acme_corp/netbox-summit-2026-ee:v3.22-3
    pull:
      policy: missing
    environment-variables:
      pass:
        - AWS_ACCESS_KEY_ID
        - AWS_SECRET_ACCESS_KEY
        - AWS_SESSION_TOKEN
        - AWS_DEFAULT_REGION
        - NETBOX_URL
        - NETBOX_TOKEN
        - AAP_URL
        - AAP_USERNAME
        - AAP_PASSWORD
        - AAP_TOKEN
        - EDA_STREAM_TOKEN
        - REGISTRY_HOST
        - REGISTRY_USERNAME
        - REGISTRY_PASSWORD
        - AH_URL
        - AH_TOKEN
        - GITHUB_TOKEN
        - GITHUB_REPO
        - GITHUB_REPORT_DIR
        - REPORT_SERVER_HOST
        - REPORT_SERVER_PORT
        - REPORT_URL
        - PRIVATE_KEY_PATH
        - IOSXE_VERSION
        - ROUTER_IP
        - ROUTER_PASSWORD
        - ROUTER_USERNAME
        - ROUTER_PRIMARY_GW
        - ROUTER_BACKUP_GW

  mode: stdout

  playbook-artifact:
    enable: false

  logging:
    level: warning
